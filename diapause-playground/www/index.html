<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>diapause playground</title>
  <meta name="description"
        content="Expand #[diapause::coroutine(...)] functions in your browser: see the generated code, control-flow graphs, and positioned errors as you type.">
  <meta property="og:title" content="diapause playground">
  <meta property="og:description"
        content="Expand #[diapause::coroutine(...)] functions in your browser: see the generated code, control-flow graphs, and positioned errors as you type.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://todesking.github.io/diapause/">
  <meta property="og:site_name" content="diapause playground">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="vendor/highlight/github.min.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <header>
    <h1>diapause playground</h1>
    <p>
      Paste a function annotated with
      <code>#[diapause::coroutine(...)]</code>; it is expanded in your
      browser as you type.
      <a href="https://github.com/todesking/diapause">diapause on GitHub</a>
    </p>
  </header>

  <p id="status" role="status" hidden></p>

  <main>
    <section class="pane" id="input-pane" aria-label="Input">
      <div class="pane-header">
        <h2>Input</h2>
        <label for="examples">Example</label>
        <select id="examples" aria-label="Load an example"></select>
      </div>
      <div id="editor">
        <!-- Two mirrors of the textarea text stacked under it: the
             error layer paints range backgrounds, the syntax layer
             paints colored tokens. The textarea's own text is
             transparent; only its caret and selection show. -->
        <pre id="highlight-layer" aria-hidden="true"><code id="highlight-content"></code></pre>
        <pre id="syntax-layer" aria-hidden="true"><code id="syntax-content"></code></pre>
        <textarea id="source" spellcheck="false" autocomplete="off"
                  autocapitalize="off" wrap="off"
                  aria-label="Source code"></textarea>
      </div>
      <ul id="errors" hidden></ul>
    </section>

    <section class="pane" id="output-pane" aria-label="Output">
      <div class="tabs" role="tablist" aria-label="Output view">
        <button role="tab" id="tab-cfg-simplified" data-target="view-cfg-simplified"
                aria-selected="true">CFG (simplified)</button>
        <button role="tab" id="tab-cfg-raw" data-target="view-cfg-raw"
                aria-selected="false">CFG (raw)</button>
        <button role="tab" id="tab-expanded" data-target="view-expanded"
                aria-selected="false">Expanded code</button>
      </div>
      <div class="view" id="view-cfg-simplified" role="tabpanel"
           aria-labelledby="tab-cfg-simplified"></div>
      <div class="view" id="view-cfg-raw" role="tabpanel"
           aria-labelledby="tab-cfg-raw" hidden></div>
      <div class="view" id="view-expanded" role="tabpanel"
           aria-labelledby="tab-expanded" hidden><pre id="expanded"></pre></div>
    </section>
  </main>
</body>
</html>
