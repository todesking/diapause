[package]
name = "diapause-playground"
version.workspace = true
edition.workspace = true

[lib]
# `cdylib` is the wasm-bindgen artifact; `rlib` keeps the crate testable
# on the host target.
crate-type = ["cdylib", "rlib"]

[dependencies]
diapause-macro-core = { path = "../diapause-macro-core" }
syn = { version = "2", features = ["full"] }
quote = "1"
# `span-locations` makes fallback (non-proc-macro) spans carry real
# line/column info, so errors can be positioned in the pasted source.
proc-macro2 = { version = "1", features = ["span-locations"] }
prettyplease = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
