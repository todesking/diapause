[workspace]
resolver = "3"
members = [
    "diapause",
    "diapause-bench",
    "diapause-difftest",
    "diapause-macro",
    "diapause-macro-core", "diapause-no-std-test",
    "diapause-playground",
]
exclude = ["diapause-macro-core/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/todesking/diapause"
# Determined by edition 2024; the crates use no library APIs newer
# than `core::error::Error` (1.81).
rust-version = "1.85"
