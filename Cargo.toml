[workspace]
resolver = "3"
members = [
    "diapause",
    "diapause-bench",
    "diapause-difftest",
    "diapause-macro",
    "diapause-macro-core", "diapause-no-std-test",
    "diapause-playground",
]
exclude = ["diapause-macro-core/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/todesking/diapause"
# Determined by let-chains (stabilized in 1.88); edition 2024 alone
# would allow 1.85. Verified by building and testing on a real 1.88
# toolchain.
rust-version = "1.88"
