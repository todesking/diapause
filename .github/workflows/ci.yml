name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on PRs; let main runs finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: todesking/github-actions-workflows/.github/workflows/rust-ci.yml@main
    with:
      # Bare metal target for the no_std regression check below.
      targets: thumbv7em-none-eabihf
      # Wider difftest sweep than the local default of 48 cases; the seed
      # stays fixed, so this is still deterministic.
      test-env: |
        DIAPAUSE_DIFFTEST_CASES=300
      # Guards the no_std claim: build the no-std test crate (and thus
      # diapause itself) for a bare metal target with no std available.
      extra-check: cargo build -p diapause-no-std-test --target thumbv7em-none-eabihf
