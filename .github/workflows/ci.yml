name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Wider difftest sweep than the local default of 48 cases; the seed
  # stays fixed, so this is still deterministic.
  DIAPAUSE_DIFFTEST_CASES: "300"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Runs the full test suite, including the difftest crate with its
      # default (fixed) generator seed.
      - name: Test
        run: cargo test --workspace
