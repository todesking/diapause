<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>baregen playground</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <header>
    <h1>baregen playground</h1>
    <p>
      Paste a function annotated with
      <code>#[baregen::coroutine(...)]</code>; it is expanded in your
      browser as you type.
      <a href="https://github.com/todesking/baregen">baregen on GitHub</a>
    </p>
  </header>

  <p id="status" role="status" hidden></p>

  <main>
    <section class="pane" id="input-pane" aria-label="Input">
      <h2>Input</h2>
      <div id="editor">
        <!-- Mirrors the textarea text so error ranges can be painted
             behind it; its own text is transparent. -->
        <pre id="highlight-layer" aria-hidden="true"><code id="highlight-content"></code></pre>
        <textarea id="source" spellcheck="false" autocomplete="off"
                  autocapitalize="off" wrap="off"
                  aria-label="Source code"></textarea>
      </div>
      <ul id="errors" hidden></ul>
    </section>

    <section class="pane" id="output-pane" aria-label="Output">
      <div class="tabs" role="tablist" aria-label="Output view">
        <button role="tab" id="tab-cfg-simplified" data-target="view-cfg-simplified"
                aria-selected="true">CFG (simplified)</button>
        <button role="tab" id="tab-cfg-raw" data-target="view-cfg-raw"
                aria-selected="false">CFG (raw)</button>
        <button role="tab" id="tab-expanded" data-target="view-expanded"
                aria-selected="false">Expanded code</button>
      </div>
      <div class="view" id="view-cfg-simplified" role="tabpanel"
           aria-labelledby="tab-cfg-simplified"></div>
      <div class="view" id="view-cfg-raw" role="tabpanel"
           aria-labelledby="tab-cfg-raw" hidden></div>
      <div class="view" id="view-expanded" role="tabpanel"
           aria-labelledby="tab-expanded" hidden><pre id="expanded"></pre></div>
    </section>
  </main>
</body>
</html>
